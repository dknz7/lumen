name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Produces a draft release.'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.ps1 uses `git describe`

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Test before shipping
        run: go test ./...

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Build binary + installer
        shell: pwsh
        run: |
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          .\build.ps1 -Version '${{ steps.ver.outputs.version }}' -Installer

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item lumen.exe, LICENSE, README.md staging\
          Compress-Archive -Path staging\* -DestinationPath "dist\Lumen-${{ steps.ver.outputs.version }}-portable.zip" -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\* -Include *.exe,*.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Lumen ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.ver.outputs.version) || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            dist/LumenSetup.exe
            dist/Lumen-${{ steps.ver.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt
          body: |
            ## Install

            Download **LumenSetup.exe** and run it. No admin rights needed — Lumen
            installs per-user and adds itself to your Start menu.

            Prefer no installer? **Lumen-${{ steps.ver.outputs.version }}-portable.zip**
            contains a standalone `lumen.exe` you can run from anywhere.

            ### Requirements
            - Windows 10 (21H2+) or Windows 11, 64-bit
            - [PotPlayer](https://potplayer.daum.net/) for playback
            - A Plex account

            Verify your download against `SHA256SUMS.txt`.

            ---
